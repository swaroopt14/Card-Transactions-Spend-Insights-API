spring:
  application:
    name: spend-insights-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:spenddb;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
app:
  jwt:
    # Dev-only default. Override with JWT_SECRET (>= 32 chars) in real deployments.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}
    expiry-minutes: 60
  fraud:
    # HIGH_AMOUNT fires only when amount is strictly greater than this value.
    high-amount-threshold: 50000
    # Count of already-saved transactions inside the velocity window that triggers VELOCITY.
    # The transaction being recorded is not counted until after the rules run.
    max-txn-per-minute: 5
    # Inclusive window [occurredAt - window, occurredAt], in seconds. Default is one minute.
    velocity-window-seconds: 60
    # A different place inside this many minutes is GEO_VELOCITY. Same place is clean.
    geo-window-minutes: 60
    # After a flagged purchase, a later amount above 20% of the high-amount threshold is REPEAT_RISK.
    repeat-flag-hours: 72
    repeat-limit-factor: 0.20
    # After a prior flag, amounts above this suggest a network step-up challenge.
    step-up-amount: 5000
    # Categories treated as high-risk while the card is in the flagged-once cohort.
    high-risk-categories: ENTERTAINMENT,OTHER
    # Pepper for the card reference fingerprint. Override in real deployments.
    token-pepper: ${CARD_TOKEN_PEPPER:${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}}
  network:
    # memory keeps velocity and dynamic CVV in this process. redis uses REDIS_URL.
    state: ${NETWORK_STATE:memory}
    redis-url: ${REDIS_URL:}
    # A rule score at or above this holds authorization for step-up. Below it, the row is written.
    authorize-threshold: 70
    # Hard stop in the prevention layer. The fraud VELOCITY flag is a lower, separate count.
    velocity-block: 30
    velocity-window-seconds: 60
    dynamic-cvv-seconds: 60
    step-up-ttl-seconds: 300
    clearing-budget-ms: 50
